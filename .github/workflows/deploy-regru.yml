name: Деплой на reg.ru

# Каждый пуш в main собирает сайт и выкладывает dist/ на хостинг reg.ru по SSH-ключу.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Настроить ключ
        env:
          SSH_KEY: ${{ secrets.REGRU_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.REGRU_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выложить файлы
        run: |
          rsync -az --delete --itemize-changes \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            dist/ "${{ secrets.REGRU_USER }}@${{ secrets.REGRU_HOST }}:${{ secrets.REGRU_PATH }}"

      # Проверяем файлы на сервере, а не ответ по HTTP: reg.ru отдаёт 500
      # на запросы из дата-центров, внешняя проверка кода тут ничего не значит.
      - name: Проверить файлы на сервере
        run: |
          MAIN=$(grep -o 'assets/main-[^"]*\.js' dist/index.html | head -1)
          echo «ожидаемый бандл: $MAIN»
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.REGRU_USER }}@${{ secrets.REGRU_HOST }}" \
            "test -f '${{ secrets.REGRU_PATH }}$MAIN' && test -f '${{ secrets.REGRU_PATH }}.htaccess' && test -f '${{ secrets.REGRU_PATH }}privacy.html' && echo 'файлы на месте'"
