name: checks

# Сборка и проверки на каждый пуш и PR. Деплой делает сам Vercel:
# проект привязан к репозиторию, и пуш в main выкатывается на прод.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить расчёты
        run: npm run check

      - name: Собрать
        run: npm run build
