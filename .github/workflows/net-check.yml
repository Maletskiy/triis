name: Проверка снаружи

# Ручная диагностика: смотрит, что отдаёт хостинг reg.ru для triis.ru,
# с независимой машины (своя сеть может перехватывать TLS по SNI).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Сертификат и ответы хостинга
        run: |
          IP=37.140.192.199
          echo "── сертификат для SNI triis.ru ──"
          echo | openssl s_client -connect $IP:443 -servername triis.ru 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates || echo «рукопожатие не удалось»
          echo "── наш сайт, Host triis.ru ──"
          curl -s -m 20 -o /dev/null -w 'код=%{http_code} размер=%{size_download}\n' \
            -H 'Host: triis.ru' http://$IP/ || true
          echo "── наш сайт, Host www.triis.ru ──"
          curl -s -m 20 -o /dev/null -w 'код=%{http_code} размер=%{size_download}\n' \
            -H 'Host: www.triis.ru' http://$IP/ || true
          echo "── контроль: соседний сайт sborkaburo.ru по HTTPS ──"
          curl -s -m 20 -o /dev/null -w 'код=%{http_code} размер=%{size_download}\n' https://sborkaburo.ru/ || true
          echo "── контроль: reg.ru по HTTPS ──"
          curl -s -m 20 -o /dev/null -w 'код=%{http_code} размер=%{size_download}\n' https://www.reg.ru/ || true
